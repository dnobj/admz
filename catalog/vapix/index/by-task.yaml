# Task index — maps user intents to operation files.
#
# Keys are task slugs. Values are lists of file paths (relative to
# the catalog vapix/ root) that are relevant for that task.
#
# Paths include version folder: 1.0/ for json-rpc, unversioned/ for legacy-cgi.

