endpoint: /vapix/services
generation: soap
api_id: schedule-service
description: >
  Axis Schedule SOAP service. Manages time-of-day / day-of-week
  schedules that gate other PACS resources (door access, recording,
  event rules, etc.). Schedules are expressed in RFC 5545 (iCalendar)
  syntax — VEVENTs with DTSTART/DTEND for intervals, DTSTART-only for
  pulses; RRULE for recurrence; exception schedules override base
  schedules.
notes: >
  Namespace ``axsch:`` (``http://www.axis.com/vapix/ws/schedule/``).
  Built-in defaults include ``standard_office_hours``,
  ``standard_weekends``, ``always``, ``never`` — query with
  GetScheduleList. Schedules can be attached to door configurations
  via the door-control-service (DoorScheduleConfiguration).
