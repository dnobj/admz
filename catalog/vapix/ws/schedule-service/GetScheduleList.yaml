id: schedule-service:GetScheduleList
cgi: schedule-service
method: POST
risk_level: read-only

soap_namespace: "http://www.axis.com/vapix/ws/schedule/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axsch="http://www.axis.com/vapix/ws/schedule/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axsch:GetScheduleList>
          <axsch:Limit>{limit}</axsch:Limit>
        </axsch:GetScheduleList>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    limit:
      required: false
      default: "100"
      description: "Maximum number of schedule entries to return"

response:
  format: xml

notes: >
  Returns every schedule the device knows about: tokens, names,
  ScheduleDefinition (RFC 5545 iCalendar text),
  ExceptionScheduleDefinition, Description. Use the tokens to
  reference schedules from door / event / other configurations.

requires:
  auth_level: admin
