id: schedule-service:ScheduleActive
cgi: schedule-service
method: POST
risk_level: read-only

soap_namespace: "http://www.axis.com/vapix/ws/schedule/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axsch="http://www.axis.com/vapix/ws/schedule/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axsch:ScheduleActive>
          <axsch:Token>{token}</axsch:Token>
        </axsch:ScheduleActive>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Schedule token to check (from GetScheduleList)"

response:
  format: xml

notes: >
  Returns whether the named schedule is currently active and whether
  it's in an exception state. Result: ``IF (any base active) AND NOT
  (any exception active)``. Useful as a precondition check before
  attempting an access-controlled operation.

requires:
  auth_level: admin
