id: event-service:GetTopicTree
cgi: event-service
method: POST
risk_level: read-only

soap_namespace: "http://www.axis.com/vapix/ws/event1"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:aev="http://www.axis.com/vapix/ws/event1"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <aev:GetEventInstances />
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>

response:
  format: xml

notes: >
  Alias for GetEventInstances — returns the event topic tree.
  The topic tree organizes events hierarchically (e.g.,
  tns1:Device/tnsaxis:IO/VirtualInput). Stateful events have
  current values; stateless events are one-shot triggers.

requires:
  auth_level: admin
