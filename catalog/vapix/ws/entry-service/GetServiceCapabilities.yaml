id: entry-service:GetServiceCapabilities
cgi: entry-service
method: POST
risk_level: read-only

soap_namespace: "http://www.onvif.org/ver10/device/wsdl"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:tds="http://www.onvif.org/ver10/device/wsdl"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <tds:GetServiceCapabilities />
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>

response:
  format: xml

notes: >
  Returns capabilities of the entry service itself.

requires:
  auth_level: admin
  property: Properties.API.WebService.EntryService=yes
