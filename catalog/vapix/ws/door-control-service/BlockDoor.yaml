id: door-control-service:BlockDoor
cgi: door-control-service
method: POST
risk_level: service-affecting

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:BlockDoor>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:BlockDoor>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

service_impact: >
  Door becomes Blocked — locked, ignores card reads, ignores
  schedule-driven unlocks, requires a privileged override (such as
  LockDownDoor or factory-default-style reconfiguration) to exit.
  Stronger than LockDoor; used during incidents.

notes: >
  Pair with the event-logger-service to verify the block happened.
  ReleaseDoor returns the door to its scheduled state.

requires:
  auth_level: admin
