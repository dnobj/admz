id: door-control-service:LockDownDoor
cgi: door-control-service
method: POST
risk_level: dangerous

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

danger_description: >
  Forces the door into LockedDown emergency mode: locked, AccessDoor
  refused, all scheduled unlocks suppressed. Use only in genuine
  emergencies. Recovery requires ReleaseDoor (and operators on the
  ground will likely call you to ask why the door won't open).

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:LockDownDoor>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:LockDownDoor>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

service_impact: >
  Emergency mode — people cannot access the door including via valid
  credentials. Two-gate confirmation is required.

requires:
  auth_level: admin
