id: door-control-service:AccessDoor
cgi: door-control-service
method: POST
risk_level: service-affecting

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:AccessDoor>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:AccessDoor>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

service_impact: >
  Temporarily unlocks the door for the configured AccessTime,
  generating Access events. Physical-access-control side effect —
  someone can open the door for that interval. Use only when the
  operator has authorized the access; never as a routine read.

notes: >
  The "grant access" verb. Unlocks the door for AccessTime
  (default ~10 seconds), then automatically re-locks. Sends
  AccessGranted / AccessTaken events the event-logger-service
  records. For sustained unlock use UnlockDoor; for emergency
  release use LockOpenDoor.

requires:
  auth_level: admin
