id: door-control-service:UnlockDoor
cgi: door-control-service
method: POST
risk_level: service-affecting

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:UnlockDoor>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:UnlockDoor>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

service_impact: >
  Keeps the door unlocked indefinitely (until ReleaseDoor or a
  different mode is set). The door is open for anyone to use during
  that window — typically used for delivery windows or staffed
  reception.

notes: >
  Different from AccessDoor (temporary, time-limited unlock).
  UnlockDoor is sustained. Often paired with a schedule.

requires:
  auth_level: admin
