id: door-control-service:LockDoor
cgi: door-control-service
method: POST
risk_level: service-affecting

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:LockDoor>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:LockDoor>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

service_impact: >
  Forces the door into the locked state, overriding any current
  Accessed / Unlocked mode. People currently passing through may be
  blocked; combine with operator awareness.

notes: >
  Use ReleaseDoor (not implemented here yet) to return to the
  scheduled/default state. LockOpenDoor inverts this — keeps the
  door unlocked. LockDownDoor is the emergency variant that also
  inhibits AccessDoor.

requires:
  auth_level: admin
