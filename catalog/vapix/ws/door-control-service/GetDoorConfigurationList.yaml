id: door-control-service:GetDoorConfigurationList
cgi: door-control-service
method: POST
risk_level: read-only

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:GetDoorConfigurationList>
          <axtdc:Limit>{limit}</axtdc:Limit>
        </axtdc:GetDoorConfigurationList>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    limit:
      required: false
      default: "100"
      description: "Maximum number of door-configuration entries to return"

response:
  format: xml

notes: >
  Returns the full DoorConfiguration for every door — Lock.Type,
  DoorMonitor settings, ExitButton config, the link to a
  DoorScheduleConfiguration (if any), etc. This is the read-side
  counterpart of SetDoorConfiguration; use it before changing
  hardware-tied behavior so you can revert if needed.

requires:
  auth_level: admin
