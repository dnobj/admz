endpoint: /vapix/services
generation: soap
api_id: door-control-service
description: >
  Axis Door Control SOAP service. Manages physical-access-control
  devices (door controllers like A1601, A1610): list and inspect doors,
  configure lock/door-monitor hardware, grant access, lock / unlock /
  block / lock-open doors, and observe door state. The service is
  used by AXIS Camera Station Secure Entry and by third-party PACS
  integrations.
notes: >
  All SOAP requests POST XML to /vapix/services. The service is
  differentiated by the XML namespace ``axtdc:`` (Axis Door Control):
  ``http://www.axis.com/vapix/ws/door-control/``.
  Doors are identified by a token (e.g.
  ``Axis-00408c184bdb:1352121495.979065000``) — read operations
  return tokens that write operations then reference. Use
  GetDoorList / GetDoorInfoList to enumerate.
  Authentication is the same as the rest of the VAPIX surface
  (digest/basic per device auth policy).
