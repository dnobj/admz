id: door-control-service:GetDoorState
cgi: door-control-service
method: POST
risk_level: read-only

soap_namespace: "http://www.axis.com/vapix/ws/door-control/"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:axtdc="http://www.axis.com/vapix/ws/door-control/"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <axtdc:GetDoorState>
          <axtdc:Token>{token}</axtdc:Token>
        </axtdc:GetDoorState>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    token:
      required: true
      description: "Door token (from GetDoorInfoList)"

response:
  format: xml

notes: >
  Returns the live state of one door: DoorPhysicalState (Closed /
  Open / Unknown), DoorMode (Locked / Unlocked / Accessed / Blocked /
  LockedDown / LockedOpen / DoubleLocked / Unknown), Alarm, Tamper.
  The most common diagnostic call when a door doesn't behave as
  expected.

requires:
  auth_level: admin
