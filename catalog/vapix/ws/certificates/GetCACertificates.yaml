id: certificates:GetCACertificates
cgi: certificates
method: POST
risk_level: read-only

soap_namespace: "http://www.onvif.org/ver10/device/wsdl"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:tds="http://www.onvif.org/ver10/device/wsdl"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <tds:GetCACertificates />
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>

response:
  format: xml

notes: >
  Returns all CA certificates installed on the device.
  Uses the ONVIF GetCACertificates method via the tds: namespace.

requires:
  auth_level: admin
