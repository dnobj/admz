id: certificates:CreateCertificate2
cgi: certificates
method: POST
risk_level: normal

soap_namespace: "http://www.axis.com/vapix/ws/certificates"

request:
  content_type: application/xml
  body_xml: |
    <SOAP-ENV:Envelope
        xmlns:acertificates="http://www.axis.com/vapix/ws/certificates"
        xmlns:acert="http://www.axis.com/vapix/ws/cert"
        xmlns:SOAP-ENV="http://www.w3.org/2003/05/soap-envelope">
      <SOAP-ENV:Body>
        <acertificates:CreateCertificate2>
          <acertificates:Id>{cert_id}</acertificates:Id>
          <acertificates:Subject>
            <acert:CN>{common_name}</acert:CN>
            <acert:C>{country}</acert:C>
          </acertificates:Subject>
          <acertificates:ValidNotBefore>{valid_from}</acertificates:ValidNotBefore>
          <acertificates:ValidNotAfter>{valid_until}</acertificates:ValidNotAfter>
        </acertificates:CreateCertificate2>
      </SOAP-ENV:Body>
    </SOAP-ENV:Envelope>
  params:
    cert_id: { required: true, description: "Certificate identifier" }
    common_name: { required: true, description: "CN for the certificate subject" }
    country: { required: false, default: "SE", description: "Country code (C)" }
    valid_from: { required: true, description: "Start date (ISO 8601, e.g. 2024-01-01T00:00:00)" }
    valid_until: { required: true, description: "End date (ISO 8601, e.g. 2034-01-01T00:00:00)" }

response:
  format: xml

notes: >
  Creates a self-signed certificate on the device. Should only be used for
  initial setup — replace with a CA-signed certificate for production.

requires:
  auth_level: admin
  property: Properties.API.WebService.CertificateService=yes
