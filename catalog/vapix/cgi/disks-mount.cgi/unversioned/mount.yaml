id: disks-mount.cgi:mount
cgi: disks-mount.cgi

method: GET
request:
  query:
    action: "{action}"
    diskid: "{diskid}"
  content_type: null

response:
  format: text
  success: "OK"
  error_prefix: "Error:"
  description: >
    Mount or unmount a disk. Action is "mount" or "unmount".

risk_level: service-affecting
service_impact: >
  Unmounting a disk stops all recording to that disk.

requires:
  auth_level: admin
