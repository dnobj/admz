id: firmwaremanagement.cgi:upgrade
cgi: firmwaremanagement.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: multipart/form-data
  timeout: 600
  body:
    json:
      apiVersion: "1.0"
      method: upgrade
    file: "{firmware_file}"

response:
  format: json
  data_path: data

risk_level: dangerous
danger_description: >
  Uploads new firmware to the device. The device will reboot automatically
  after the upload completes.
notes: >
  After reboot the device auto-verifies and auto-commits the new firmware.
  If verification fails, it rolls back to the previous version automatically.
  Manual commit (firmwaremanagement.cgi:commit) is not normally required —
  use it only to force-commit before auto-verification completes.
  Pass factoryDefaultMode (none|soft|hard) as a param for downgrade scenarios.

requires:
  auth_level: admin
