id: firmwaremanagement.cgi:commit
cgi: firmwaremanagement.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: commit

response:
  format: json
  data_path: data

risk_level: normal
notes: >
  Manually commits the active firmware. Not normally needed — the device
  auto-commits after verifying a successful upgrade. Use this only to
  force-commit before auto-verification completes, or if a previous
  upgrade is still in pendingCommit state.

requires:
  auth_level: admin
