id: firmwaremanagement.cgi:rollback
cgi: firmwaremanagement.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: rollback

response:
  format: json
  data_path: data

risk_level: service-affecting
notes: >
  Rolls back to previous firmware version. Device reboots.

requires:
  auth_level: admin
