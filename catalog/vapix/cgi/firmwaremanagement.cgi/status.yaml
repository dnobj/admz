id: firmwaremanagement.cgi:status
cgi: firmwaremanagement.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.4"
    method: status

response:
  format: json
  data_path: data
  fields:
    - activeFirmwareVersion
    - activeFirmwarePartition
    - inactiveFirmwareVersion
    - lastUpgradeAt
    - upgradeState

risk_level: read-only

requires:
  auth_level: admin
