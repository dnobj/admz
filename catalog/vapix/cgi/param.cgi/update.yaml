id: param.cgi:update
cgi: param.cgi

method: GET
request:
  query:
    action: update
    # Additional params: key=value pairs for parameters to set
    # e.g. root.Image.I0.Resolution=1920x1080
  content_type: null

response:
  format: text
  success: "OK"
  error_prefix: "# Error:"

risk_level: normal

rollback:
  strategy: revert-params
  read_action: list
  description: >
    Read current values before update, store them, re-apply
    on rollback via another update call.

requires:
  auth_level: admin
