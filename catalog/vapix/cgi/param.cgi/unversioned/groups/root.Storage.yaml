group: root.Storage
cgi: param.cgi
read_action: list
write_action: update
description: >
  Storage configuration per disk slot. Controls cleanup policies,
  maximum age, auto-repair, and friendly names for SD cards and
  network shares.
channel_indexed: true
channel_key: "S"

parameters:
  FriendlyName:
    type: string
    description: User-friendly name for the storage device.
    auth_level: admin

  CleanupPolicyActive:
    type: enum
    valid_values: ["yes", "no"]
    description: Whether automatic cleanup is active.
    auth_level: admin

  CleanupMaxAge:
    type: integer
    description: Maximum age of recordings in days before cleanup.
    auth_level: admin

  AutoRepair:
    type: enum
    valid_values: ["yes", "no"]
    description: Attempt auto-repair of corrupted filesystems.
    auth_level: admin
