group: root.IOPort
cgi: param.cgi
read_action: list
write_action: update
description: >
  I/O port configuration via parameter API. Configure port direction,
  names, and active states. Port numbering starts from 0 in params
  but from 1 in port.cgi.
channel_indexed: true
channel_key: "I"

parameters:
  Configurable:
    type: enum
    valid_values: ["yes", "no"]
    description: Whether this port's direction is configurable.
    auth_level: viewer
    readonly: true

  Direction:
    type: enum
    valid_values: ["input", "output"]
    description: Port direction (input or output).
    auth_level: admin

  Input.Name:
    type: string
    description: Friendly name for input port.
    auth_level: admin

  Output.Name:
    type: string
    description: Friendly name for output port.
    auth_level: admin

  Output.Active:
    type: enum
    valid_values: ["open", "closed"]
    description: Active state for output port.
    auth_level: operator
