group: root.Properties
cgi: param.cgi
read_action: list
write_action: null
description: >
  Read-only device capability properties. Used to discover supported
  features before issuing commands. Includes image, PTZ, audio, I/O,
  firmware, and API capability flags.

parameters:
  API.HTTP.Version:
    type: string
    description: HTTP API version.
    auth_level: viewer
    readonly: true

  Firmware.Version:
    type: string
    description: Current firmware version.
    auth_level: viewer
    readonly: true

  Image.Resolution:
    type: string
    description: Comma-separated supported resolutions.
    auth_level: viewer
    readonly: true

  Image.NbrOfViews:
    type: integer
    description: Number of view channels.
    auth_level: viewer
    readonly: true

  PTZ.PTZ:
    type: enum
    valid_values: ["yes", "no"]
    description: PTZ support flag.
    auth_level: viewer
    readonly: true

  Audio.Audio:
    type: enum
    valid_values: ["yes", "no"]
    description: Audio support flag.
    auth_level: viewer
    readonly: true

  IO.NbrOfInputs:
    type: integer
    description: Number of digital input ports.
    auth_level: viewer
    readonly: true

  IO.NbrOfOutputs:
    type: integer
    description: Number of digital output ports.
    auth_level: viewer
    readonly: true

  GuardTour.GuardTour:
    type: enum
    valid_values: ["yes", "no"]
    description: Guard tour support flag.
    auth_level: viewer
    readonly: true

  LightControl.LightControl2:
    type: enum
    valid_values: ["yes", "no"]
    description: Light control API v2 support flag.
    auth_level: viewer
    readonly: true
