group: root.ImageSource
cgi: param.cgi
read_action: list
write_action: update
description: >
  Image source sensor settings. Controls brightness, contrast,
  sharpness, white balance, exposure, WDR, defog, and stabilization
  per image source channel.
channel_indexed: true
channel_key: "I"

parameters:
  Sensor.Brightness:
    type: integer
    range: [0, 100]
    description: Image brightness level.
    auth_level: operator

  Sensor.Contrast:
    type: integer
    range: [0, 100]
    description: Image contrast level.
    auth_level: operator

  Sensor.Sharpness:
    type: integer
    range: [0, 100]
    description: Image sharpness level.
    auth_level: operator

  Sensor.ColorLevel:
    type: integer
    range: [0, 100]
    description: Color saturation level.
    auth_level: operator

  Sensor.WhiteBalance:
    type: enum
    valid_values:
      - auto
      - auto_indoor
      - auto_outdoor
      - hold
      - manual
      - fixed_outdoor1
      - fixed_outdoor2
      - fixed_indoor
      - fixed_fluor1
      - fixed_fluor2
    description: White balance mode.
    auth_level: operator

  Sensor.Exposure:
    type: enum
    valid_values:
      - auto
      - flickerfree50
      - flickerfree60
      - hold
    description: Exposure mode.
    auth_level: operator

  Sensor.WDR:
    type: enum
    valid_values: ["on", "off"]
    description: Wide Dynamic Range mode.
    auth_level: operator

  Sensor.BacklightCompensation:
    type: enum
    valid_values: ["yes", "no"]
    description: Backlight compensation mode.
    auth_level: operator

  Sensor.Defog:
    type: enum
    valid_values: ["off", "on", "auto"]
    description: Electronic defog filter.
    auth_level: operator

  Sensor.Stabilizer:
    type: enum
    valid_values: ["off", "on", "low", "high"]
    description: Electronic image stabilization.
    auth_level: operator

  Rotation:
    type: enum
    valid_values: ["0", "90", "180", "270"]
    description: Image rotation angle in degrees.
    auth_level: admin
