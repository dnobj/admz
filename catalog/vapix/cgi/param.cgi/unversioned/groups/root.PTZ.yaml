group: root.PTZ
cgi: param.cgi
read_action: list
write_action: update
description: >
  PTZ movement and preset configuration. Controls default speed,
  limits, auto-flip, IR cut filter, and support properties
  per PTZ channel.
channel_indexed: true
channel_key: "Limit.L"

parameters:
  Various.V0.Enabled:
    type: enum
    valid_values: ["true", "false"]
    description: Enable/disable PTZ for this video source.
    auth_level: admin

  Various.V0.PanEnabled:
    type: enum
    valid_values: ["true", "false"]
    description: Enable/disable pan movement.
    auth_level: admin

  Various.V0.TiltEnabled:
    type: enum
    valid_values: ["true", "false"]
    description: Enable/disable tilt movement.
    auth_level: admin

  Various.V0.ZoomEnabled:
    type: enum
    valid_values: ["true", "false"]
    description: Enable/disable zoom.
    auth_level: admin

  Various.V0.IrCutFilter:
    type: enum
    valid_values: ["auto", "on", "off"]
    description: IR cut filter mode.
    auth_level: operator

  Various.V0.AutoFlip:
    type: enum
    valid_values: ["on", "off"]
    description: Auto-flip when tilting past nadir.
    auth_level: operator

requires:
  properties:
    - Properties.PTZ.PTZ
