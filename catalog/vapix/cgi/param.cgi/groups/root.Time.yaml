group: root.Time
cgi: param.cgi
read_action: list
write_action: update

description: >
  Time and NTP settings. Controls how the device synchronizes its clock.

channel_indexed: false

parameters:
  NTPServer:
    type: string
    description: NTP server address.
    auth_level: admin

  ObtainFromDHCP:
    type: boolean
    description: Get NTP server from DHCP.
    valid_values: ["yes", "no"]
    auth_level: admin

  TimeZone:
    type: string
    description: POSIX timezone string.
    example_values: ["EST5EDT", "CST6CDT", "PST8PDT", "UTC0"]
    auth_level: admin
