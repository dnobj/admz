id: param.cgi:list
cgi: param.cgi

method: GET
request:
  query:
    action: list
    group: "{group}"
  content_type: null

response:
  format: text
  success: "root."
  error_prefix: "# Error:"
  description: >
    Returns key=value pairs, one per line.
    e.g. root.Image.I0.Resolution=1920x1080

risk_level: read-only

requires:
  auth_level: viewer
