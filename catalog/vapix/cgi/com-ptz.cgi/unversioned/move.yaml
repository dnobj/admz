id: com-ptz.cgi:move
cgi: com-ptz.cgi

method: GET

request:
  query:
    pan: "{pan}"
    tilt: "{tilt}"
    zoom: "{zoom}"
    camera: "{camera}"
    speed: "{speed}"
  content_type: null

response:
  format: text
  success: ""

risk_level: normal
notes: >
  Absolute positioning. Values: pan (-180..180), tilt (-180..180),
  zoom (1..9999), speed (1..100). Camera defaults to 1.

requires:
  auth_level: operator
