id: com-ptz.cgi:goto-preset
cgi: com-ptz.cgi

method: GET

request:
  query:
    gotoserverpresetname: "{presetName}"
    camera: "{camera}"
    speed: "{speed}"
  content_type: null

response:
  format: text
  success: ""

risk_level: normal
notes: >
  Move to a named server preset position. Use gotoserverpresetno
  for numeric preset reference.

requires:
  auth_level: operator
