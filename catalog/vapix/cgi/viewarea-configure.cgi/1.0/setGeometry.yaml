id: viewarea-configure.cgi:setGeometry
cgi: viewarea-configure.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setGeometry
    params:
      viewArea:
        id: "{id:int}"
        rectangularGeometry:
          horizontalOffset: "{horizontalOffset:int}"
          verticalOffset: "{verticalOffset:int}"
          horizontalSize: "{horizontalSize:int}"
          verticalSize: "{verticalSize:int}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
