id: job.cgi:check-job
cgi: job.cgi

method: GET

request:
  query:
    jobid: "{jobid}"
  content_type: null
  params:
    jobid:
      description: Job ID returned by the disk format operation.
      required: true

response:
  format: xml
  description: >
    Returns XML with job state (running, completed, failed)
    and progress percentage.

risk_level: read-only
notes: >
  Poll this endpoint periodically after starting a disk format.
  Typical interval is 5-10 seconds. The job ID comes from the
  format-disk response.

requires:
  auth_level: admin
