id: recordedtour.cgi:record
cgi: recordedtour.cgi

method: POST
request:
  query:
    schemaversion: "{schemaversion}"
    nicename: "{nicename}"
    camera: "{camera}"
  content_type: null

response:
  format: text
  description: >
    Starts recording a new guard tour. Returns the
    recording ID. Use stoprecording.cgi to finish.

risk_level: normal

requires:
  auth_level: operator
