id: recordedtour.cgi:stop
cgi: recordedtour.cgi

method: POST
request:
  query:
    schemaversion: "{schemaversion}"
    recordedtourid: "{recordedtourid}"
  content_type: null

response:
  format: text
  description: >
    Stops playback of the specified recorded tour.

risk_level: normal

requires:
  auth_level: operator
