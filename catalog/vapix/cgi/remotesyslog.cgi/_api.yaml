endpoint: /axis-cgi/remotesyslog.cgi
generation: json-rpc
min_firmware: "9.80"
api_id: remote-syslog
description: >
  JSON-RPC API for configuring remote syslog forwarding.
  Send device logs to an external syslog server over UDP or TCP.
notes: >
  Configures the device to forward system logs to a remote syslog
  server. Supports UDP (port 514) and TCP transport.
