id: disks-raid.cgi:recreateRaid
cgi: disks-raid.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: recreateRaidOnAllComponents
    params:
      raidLevel: "{raidLevel}"

response:
  format: json
  data_path: data

risk_level: dangerous
danger_description: >
  Recreates the RAID array on all components. All existing
  data on the RAID will be destroyed. The device will need
  time to sync the new array.

requires:
  auth_level: admin
