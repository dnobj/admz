id: com-serial.cgi:write
cgi: com-serial.cgi

method: GET
request:
  query:
    port: "{port}"
    write: "{write}"
  content_type: null

response:
  format: text
  description: >
    Sends hex-encoded data to the serial port.
    Data format is hex string (e.g., "48656C6C6F").

risk_level: normal

requires:
  auth_level: operator
