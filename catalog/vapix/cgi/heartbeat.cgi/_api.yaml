endpoint: /axis-cgi/heartbeat.cgi
generation: json-rpc
min_firmware: "9.80"
api_id: heartbeat
description: >
  Heartbeat keepalive service. Send periodic heartbeats to keep
  the device aware of active client connections. If heartbeats
  stop, the device can trigger timeout events.
notes: >
  Some devices use the older /vapix/axhbt endpoint instead.
  Check Properties.API.Heartbeat.Version for support.
