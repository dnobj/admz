id: heartbeat.cgi:heartbeat
cgi: heartbeat.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: heartbeat
    params:
      duration: "{duration:int}"

response:
  format: json
  data_path: data
  fields:
    - sessionId

risk_level: read-only

requires:
  auth_level: viewer
