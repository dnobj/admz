id: audio-receive.cgi:receive
cgi: audio-receive.cgi

method: GET
request:
  query:
    audio: "1"
    audiocodec: "{audiocodec}"
    audiobitrate: "{audiobitrate}"
    audiosamplerate: "{audiosamplerate}"
    httptype: "{httptype}"
  content_type: null

response:
  format: binary
  content_type: audio/basic
  description: >
    Returns raw audio stream data. Default codec is g711.
    Use httptype=singlepart or httptype=multipart.

risk_level: read-only

requires:
  auth_level: viewer
