id: mqtt-client.cgi:configureClient
cgi: mqtt-client.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: configureClient
    params:
      server:
        protocol: "{protocol}"
        host: "{host}"
        port: "{port:int}"
      username: "{username}"
      password: "{password}"
      clientId: "{clientId}"
      keepAliveInterval: "{keepAliveInterval:int}"
      connectTimeout: "{connectTimeout:int}"
      cleanSession: "{cleanSession:bool}"
      autoReconnect: "{autoReconnect:bool}"

response:
  format: json
  data_path: data

risk_level: normal

rollback:
  strategy: revert-config
  read_action: getClientStatus

requires:
  auth_level: admin
