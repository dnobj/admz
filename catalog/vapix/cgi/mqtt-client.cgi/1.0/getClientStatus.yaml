id: mqtt-client.cgi:getClientStatus
cgi: mqtt-client.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getClientStatus

response:
  format: json
  data_path: data
  fields:
    - status.state
    - status.connectionStatus
    - config.server
    - config.clientId
    - config.cleanSession
    - config.autoReconnect

risk_level: read-only

requires:
  auth_level: admin
