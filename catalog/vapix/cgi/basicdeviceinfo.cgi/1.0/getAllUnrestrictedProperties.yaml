id: basicdeviceinfo.cgi:getAllUnrestrictedProperties
cgi: basicdeviceinfo.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getAllUnrestrictedProperties

response:
  format: json
  data_path: data.propertyList
  fields:
    - Architecture
    - Brand
    - ProdFullName
    - ProdNbr
    - ProdType
    - SerialNumber
    - Version
    - Soc

risk_level: read-only

requires:
  auth_level: none
  description: >
    Works without authentication on factory-default devices.
    On configured devices, returns a subset of properties.
