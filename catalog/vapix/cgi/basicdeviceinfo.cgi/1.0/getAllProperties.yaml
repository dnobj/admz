id: basicdeviceinfo.cgi:getAllProperties
cgi: basicdeviceinfo.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getAllProperties

response:
  format: json
  data_path: data.propertyList
  fields:
    - Architecture
    - Brand
    - ProdFullName
    - ProdNbr
    - ProdType
    - SerialNumber
    - Version
    - Soc

risk_level: read-only

requires:
  auth_level: viewer
