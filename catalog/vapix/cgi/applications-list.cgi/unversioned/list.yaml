id: applications-list.cgi:list
cgi: applications-list.cgi

method: POST

request:
  query: {}
  content_type: null

response:
  format: xml
  description: >
    Returns XML with installed application details: name, nice name,
    version, status (Running/Stopped), license status, and SDK type.

risk_level: read-only

requires:
  auth_level: admin
