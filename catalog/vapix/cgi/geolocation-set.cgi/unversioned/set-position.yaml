id: geolocation-set.cgi:set-position
cgi: geolocation-set.cgi

method: GET

request:
  query:
    lat: "{lat}"
    lng: "{lng}"
    heading: "{heading}"
    text: "{text}"
  content_type: null
  params:
    lat:
      description: Latitude in decimal degrees (e.g. 51.5074).
      required: true
    lng:
      description: Longitude in decimal degrees (e.g. -0.1278).
      required: true
    heading:
      description: Heading in degrees from true north (0-360). Optional.
      required: false
    text:
      description: Free-text location description. Optional.
      required: false

response:
  format: xml
  description: >
    Returns PositionResponse XML with GeneralSuccess on success.

risk_level: normal
notes: >
  Coordinates use decimal degrees (not ISO 6709).
  Heading is degrees from true north (0-360).

rollback:
  strategy: revert-position
  read_action: get-position
  read_cgi: geolocation-get.cgi

requires:
  auth_level: admin
