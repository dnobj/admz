id: power-settings.cgi:getCapabilities
cgi: power-settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getCapabilities

response:
  format: json
  data_path: data
  fields:
    - powerSavingSupport
    - delayedPowerDownSupport
    - powerProfileSupport
    - powerConsumerSupport
    - powerStatusSupport
    - powerConfigurationSupport
    - dynamicPowerModeSupport

risk_level: read-only

requires:
  auth_level: viewer
