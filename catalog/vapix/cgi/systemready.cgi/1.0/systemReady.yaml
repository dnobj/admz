id: systemready.cgi:systemReady
cgi: systemready.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: systemReady
    params:
      timeout: "{timeout:int}"

response:
  format: json
  data_path: data
  fields:
    - systemready
    - needsetup
    - uptime
    - bootid

risk_level: read-only

requires:
  auth_level: viewer
