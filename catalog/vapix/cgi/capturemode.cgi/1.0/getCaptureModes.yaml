id: capturemode.cgi:getCaptureModes
cgi: capturemode.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getCaptureModes

response:
  format: json
  data_path: data
  fields:
    - channel
    - captureMode
    - captureModeId
    - enabled
    - maxFPS
    - description

risk_level: read-only

requires:
  auth_level: viewer
