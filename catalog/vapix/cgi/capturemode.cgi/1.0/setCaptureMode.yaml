id: capturemode.cgi:setCaptureMode
cgi: capturemode.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setCaptureMode
    channel: "{channel}"
    captureModeId: "{captureModeId}"

response:
  format: json
  data_path: data

risk_level: service-affecting
notes: >
  Device requires reboot after capture mode change.

requires:
  auth_level: operator
