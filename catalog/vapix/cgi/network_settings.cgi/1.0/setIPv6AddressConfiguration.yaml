id: network_settings.cgi:setIPv6AddressConfiguration
cgi: network_settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setIPv6AddressConfiguration
    params:
      deviceName: "{deviceName}"
      configurationEnabled: "{configurationEnabled:bool}"
      acceptRA: "{acceptRA:bool}"
      dhcpEnabled: "{dhcpEnabled:bool}"

response:
  format: json
  data_path: data

risk_level: service-affecting
service_impact: >
  Changing IPv6 configuration may affect device connectivity.

requires:
  auth_level: admin
