id: network_settings.cgi:getNetworkInfo
cgi: network_settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getNetworkInfo

response:
  format: json
  data_path: data
  fields:
    - interfaces
    - hostname
    - ipv4
    - ipv6
    - dns
    - proxy

risk_level: read-only

requires:
  auth_level: admin
