id: network_settings.cgi:addVlan
cgi: network_settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: addVlan
    params:
      interfaceName: "{interfaceName}"
      vlanId: "{vlanId:int}"

response:
  format: json
  data_path: data

risk_level: service-affecting
service_impact: >
  Adding a VLAN changes network configuration and may
  affect device connectivity.

requires:
  auth_level: admin
