id: network_settings.cgi:setResolverConfiguration
cgi: network_settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setResolverConfiguration
    params:
      staticNameServers: "{staticNameServers}"

response:
  format: json
  data_path: data

risk_level: normal

rollback:
  strategy: revert-config
  read_action: getNetworkInfo

requires:
  auth_level: admin
