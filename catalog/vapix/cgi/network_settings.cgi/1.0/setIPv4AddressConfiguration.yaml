id: network_settings.cgi:setIPv4AddressConfiguration
cgi: network_settings.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setIPv4AddressConfiguration
    params:
      deviceName: "{deviceName}"
      configurationMode: "{configurationMode}"
      address: "{address}"
      prefixLength: "{prefixLength:int}"
      defaultRouter: "{defaultRouter}"

response:
  format: json
  data_path: data

risk_level: service-affecting
notes: >
  Changing IP address may cause loss of connectivity.

param_rules:
  - rule: value_requires
    if_param: configurationMode
    equals: "static"
    then_required: [address, prefixLength]

requires:
  auth_level: admin
