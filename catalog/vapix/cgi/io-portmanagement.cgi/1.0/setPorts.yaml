id: io-portmanagement.cgi:setPorts
cgi: io-portmanagement.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setPorts
    params:
      ports: "{ports:array}"

response:
  format: json
  data_path: data

risk_level: normal

rollback:
  strategy: revert-ports
  read_action: getPorts

requires:
  auth_level: operator
