id: opticscontrol.cgi:getOptics
cgi: opticscontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getOptics

response:
  format: json
  data_path: data
  fields:
    - numberOfOptics
    - optics

risk_level: read-only

requires:
  auth_level: operator
