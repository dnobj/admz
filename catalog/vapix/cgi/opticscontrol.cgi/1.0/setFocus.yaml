id: opticscontrol.cgi:setFocus
cgi: opticscontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setFocus
    params:
      optics:
        - opticsId: "{opticsId}"
          position: "{position:float}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
