id: opticscontrol.cgi:reset
cgi: opticscontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: reset
    params:
      optics:
        - opticsId: "{opticsId}"
          zoom: "{zoom:bool}"
          focus: "{focus:bool}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
