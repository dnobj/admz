id: opticscontrol.cgi:performAutofocus
cgi: opticscontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: performAutofocus
    params:
      optics:
        - opticsId: "{opticsId}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
