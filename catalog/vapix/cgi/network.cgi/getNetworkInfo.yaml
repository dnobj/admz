id: network.cgi:getNetworkInfo
cgi: network.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getNetworkInfo

response:
  format: json
  data_path: data
  description: >
    Returns full network configuration including IPv4, IPv6,
    DNS, hostname, active interface, link status.

risk_level: read-only

requires:
  auth_level: admin
