id: pwdgrp.cgi:add-user
cgi: pwdgrp.cgi

method: GET
request:
  query:
    action: add
    user: "{username}"
    pwd: "{password}"
    grp: "{group}"
    sgrp: "{secondary_groups}"
    comment: "{comment}"
  content_type: null

response:
  format: text
  success: "OK"
  error_prefix: "# Error:"

risk_level: normal

rollback:
  strategy: delete
  operation_id: pwdgrp.cgi:remove-user
  params:
    user: "{username}"

requires:
  auth_level: admin
