id: siren_and_light.cgi:addProfile
cgi: siren_and_light.cgi

method: POST
min_api_version: "1.0"

# Create a named, persisted profile combining a siren and/or light
# pattern. The siren_*/light_* params mirror the start op. `name` is
# required; unsupplied placeholders drop out of the body.
request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: addProfile
    params:
      name: "{name}"
      description: "{description}"
      siren:
        pattern: "{siren_pattern}"
        intensity: "{siren_intensity:int}"
        duration:
          unit: "{siren_duration_unit}"
          value: "{siren_duration_value:int}"
        priority: "{siren_priority:int}"
      light:
        pattern: "{light_pattern}"
        speed: "{light_speed:int}"
        colors: "{light_colors:array}"
        intensity: "{light_intensity:int}"
        duration:
          unit: "{light_duration_unit}"
          value: "{light_duration_value:int}"
        priority: "{light_priority:int}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: operator

params_doc:
  params:
    name: 'Required. Unique profile name, <=50 chars (also the identifier).'
    description: 'Optional free text, <=250 chars.'
    siren_pattern: "Siren pattern name (from getCapabilities)."
    siren_intensity: 'Siren intensity level, integer.'
    siren_duration_unit: "'seconds' or 'repetitions'."
    siren_duration_value: 'Integer duration value (0-259200 seconds, 0-20 repetitions).'
    siren_priority: 'Integer priority 1-10 (optional).'
    light_pattern: "Light pattern name (from getCapabilities). 'Steady' = solid single color."
    light_speed: 'Integer speed (optional).'
    light_colors: 'Array of color names, e.g. ["white"].'
    light_intensity: 'Light intensity level, integer.'
    light_duration_unit: "'seconds' or 'repetitions'."
    light_duration_value: 'Integer duration value.'
    light_priority: 'Integer priority 1-10 (optional).'
  example:
    name: White Flash 30s
    light_pattern: Steady
    light_colors: ["white"]
    light_intensity: 1
    light_duration_unit: seconds
    light_duration_value: 30

notes: >
  Creates a named, persisted profile combining a siren and/or light
  pattern, so it can later be activated with start(profile=name).
  `name` is required and unique (<=50 chars). The siren_*/light_*
  params mirror siren_and_light.cgi:start. Use getCapabilities for the
  valid pattern names, colors, and intensity ranges this device
  supports; getProfiles to avoid a duplicate name.
