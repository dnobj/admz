id: siren_and_light.cgi:getProfiles
cgi: siren_and_light.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getProfiles

response:
  format: json
  data_path: data

risk_level: read-only

requires:
  auth_level: operator

notes: >
  Lists the saved siren/light profiles registered on the device — each
  profile's name plus the siren/light pattern it encodes. Call this
  before starting by `profile` (so you use a real name) and before
  addProfile (to avoid duplicate names).
