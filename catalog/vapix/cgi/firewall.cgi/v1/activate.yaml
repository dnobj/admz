id: firewall.cgi:activate
cgi: firewall.cgi

method: PATCH
base_path: /config/rest/firewall/v1
path: /activated

request:
  content_type: application/json

response:
  format: json

risk_level: service-affecting
service_impact: >
  Activating the firewall may block network connections
  if rules are not configured correctly.

requires:
  auth_level: admin
