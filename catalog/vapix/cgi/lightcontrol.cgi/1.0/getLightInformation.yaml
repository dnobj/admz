id: lightcontrol.cgi:getLightInformation
cgi: lightcontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getLightInformation
    params: {}

response:
  format: json
  data_path: data
  fields:
    - lightID
    - lightType
    - enabled
    - synchronizeDayNightMode
    - lightState
    - automaticIntensityMode
    - automaticAngleOfIlluminationMode
    - nrOfLEDs
    - error
    - ranges

risk_level: read-only

requires:
  auth_level: operator
