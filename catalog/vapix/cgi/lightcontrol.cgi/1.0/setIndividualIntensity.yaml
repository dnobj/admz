id: lightcontrol.cgi:setIndividualIntensity
cgi: lightcontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: setIndividualIntensity
    params:
      lightID: "{lightID}"
      LEDID: "{LEDID}"
      intensity: "{intensity:int}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: operator
