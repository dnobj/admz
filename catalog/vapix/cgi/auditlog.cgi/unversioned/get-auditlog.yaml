id: auditlog.cgi:get-auditlog
cgi: auditlog.cgi

method: GET

request:
  query:
    tail: "{tail}"
  content_type: null

response:
  format: text
  description: >
    Returns audit log entries as plain text. Each entry includes
    timestamp, hostname, severity, source, and message.
    Optional tail parameter limits to N most recent entries.

risk_level: read-only

requires:
  auth_level: admin
