id: shockdetection.cgi:setEnabled
cgi: shockdetection.cgi

method: GET
request:
  query:
    schemaversion: "{schemaversion}"
    enabled: "{enabled}"
  content_type: null

response:
  format: text
  description: >
    Enables or disables shock detection (true/false).

risk_level: normal

requires:
  auth_level: admin
