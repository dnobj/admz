id: networkshare-add.cgi:add
cgi: networkshare-add.cgi

method: GET
request:
  query:
    schemaversion: "{schemaversion}"
    nicename: "{nicename}"
    address: "{address}"
    share: "{share}"
    user: "{user}"
    pass: "{pass}"
  content_type: null

response:
  format: text
  description: >
    Returns the share ID for the newly added network share.

risk_level: normal

requires:
  auth_level: admin
