id: findmydevice.cgi:find
cgi: findmydevice.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: find
    params:
      duration: "{duration:int}"

response:
  format: json
  data_path: data

risk_level: normal
notes: >
  Duration in seconds (0-3600). May interrupt audio playback.

requires:
  auth_level: admin
