id: daynight.cgi:getConfiguration
cgi: daynight.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: getConfiguration
    params:
      channel: "{channel:int}"

response:
  format: json
  data_path: data
  fields:
    - DayNightDwellTime
    - DayNightShiftLevel
    - NightDayDwellTime
    - NightDayShiftLevel
    - Autotune
    - NightFilter

risk_level: read-only

requires:
  auth_level: operator
