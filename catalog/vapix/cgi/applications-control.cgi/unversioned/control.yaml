id: applications-control.cgi:control
cgi: applications-control.cgi

method: POST

request:
  query:
    action: "{action}"
    package: "{package}"
  content_type: null

response:
  format: text
  success: "OK"

risk_level: normal
notes: >
  Valid actions: start, stop, restart, remove.
  Remove action is service-affecting.

requires:
  auth_level: admin
