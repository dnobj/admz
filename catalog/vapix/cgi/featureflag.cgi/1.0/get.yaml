id: featureflag.cgi:get
cgi: featureflag.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: get
    params:
      names: "{names}"

response:
  format: json
  data_path: data.flagValues

risk_level: read-only

requires:
  auth_level: admin
