id: record-list.cgi:list-recordings
cgi: record-list.cgi

method: GET

request:
  query:
    listentity: recordingid
    eventid: "{eventid}"
    starttime: "{starttime}"
    stoptime: "{stoptime}"
  content_type: null

response:
  format: xml
  description: >
    Returns XML with recording IDs, start/stop times, video and
    audio track information.

risk_level: read-only

requires:
  auth_level: operator
