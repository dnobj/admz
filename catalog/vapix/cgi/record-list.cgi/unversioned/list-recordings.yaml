id: record-list.cgi:list-recordings
cgi: record-list.cgi

method: GET

request:
  query:
    listentity: recordingid
    eventid: "{eventid}"
    starttime: "{starttime}"
    stoptime: "{stoptime}"
  content_type: null
  params:
    eventid:
      description: Filter recordings by event ID.
      required: false
    starttime:
      description: "Start time filter (ISO 8601, e.g. 2024-01-15T00:00:00)."
      required: false
    stoptime:
      description: "End time filter (ISO 8601, e.g. 2024-01-16T00:00:00)."
      required: false

response:
  format: xml
  description: >
    Returns XML with recording IDs, start/stop times, video and
    audio track information.

risk_level: read-only

requires:
  auth_level: operator
