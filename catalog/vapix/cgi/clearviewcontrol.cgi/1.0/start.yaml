id: clearviewcontrol.cgi:start
cgi: clearviewcontrol.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: start
    params:
      id: "{id:int}"
      duration: "{duration:int}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: operator
