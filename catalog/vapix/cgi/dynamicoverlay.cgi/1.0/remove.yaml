id: dynamicoverlay.cgi:remove
cgi: dynamicoverlay.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: remove
    params:
      camera: "{camera}"
      identity: "{identity}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
