id: dynamicoverlay.cgi:addText
cgi: dynamicoverlay.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: addText
    params:
      camera: "{camera}"
      text: "{text}"
      position: "{position}"
      fontSize: "{fontSize}"
      textColor: "{textColor}"
      textBGColor: "{textBGColor}"

response:
  format: json
  data_path: data
  fields:
    - identity

risk_level: normal

requires:
  auth_level: operator
