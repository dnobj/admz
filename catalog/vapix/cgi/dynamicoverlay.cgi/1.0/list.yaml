id: dynamicoverlay.cgi:list
cgi: dynamicoverlay.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: list
    params:
      camera: "{camera}"

response:
  format: json
  data_path: data
  fields:
    - identity
    - text
    - position
    - fontSize
    - textColor
    - textBGColor
    - overlayPath

risk_level: read-only

requires:
  auth_level: operator
