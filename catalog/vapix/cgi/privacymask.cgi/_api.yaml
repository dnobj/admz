endpoint: /axis-cgi/privacymask.cgi
generation: json-rpc
min_firmware: "7.40"
api_id: privacy-mask
description: >
  JSON-RPC API for managing privacy masks on video channels.
  Supports listing, adding, removing, and modifying polygon-based
  privacy masks that obscure regions of the video feed.
notes: >
  Privacy masks are defined as polygons in normalized coordinates (0-1000).
  Each mask has a color and can be enabled/disabled independently.
  This API complements the older pencil.cgi filter-based approach.
