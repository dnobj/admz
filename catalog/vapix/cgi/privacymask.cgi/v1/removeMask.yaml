id: privacymask.cgi:removeMask
cgi: privacymask.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: removeMask
    params:
      channel: "{channel:int}"
      maskID: "{maskID:int}"

response:
  format: json
  data_path: data

risk_level: dangerous

danger_description: >
  Permanently removes a privacy mask. Areas that were obscured
  will become visible in the video stream immediately.

requires:
  auth_level: admin
