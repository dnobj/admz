id: privacymask.cgi:addMask
cgi: privacymask.cgi

method: POST
min_api_version: "1.0"

request:
  content_type: application/json
  body:
    apiVersion: "1.0"
    method: addMask
    params:
      channel: "{channel:int}"
      polygon: "{polygon:array}"
      color: "{color}"

response:
  format: json
  data_path: data

risk_level: normal

requires:
  auth_level: admin
