id: disks-repair.cgi:repair
cgi: disks-repair.cgi

method: GET
request:
  query:
    diskid: "{diskid}"
  content_type: null

response:
  format: text
  description: >
    Returns a job ID that can be polled with job.cgi.

risk_level: service-affecting
service_impact: >
  Disk will be unavailable during repair.
  Recording will be paused on the repaired disk.

requires:
  auth_level: admin
