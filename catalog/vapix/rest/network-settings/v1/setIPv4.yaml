id: network-settings:setIPv4
cgi: network-settings

method: PUT
base_path: /config/rest/network-settings/v1
path: /ipv4

response:
  format: json

risk_level: normal

service_impact: >
  Changing the IPv4 address may disconnect the device from the
  current network. Ensure the new address is reachable.

requires:
  auth_level: admin
