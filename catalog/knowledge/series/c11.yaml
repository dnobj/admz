display_name: C11 Series Network Speakers
applies_to: "C11xx network speakers (e.g. C1110-E Network Cabinet Speaker)"

hints:
  - id: c11-cabinet-speaker
    topic: vapix-support
    summary: C11 series are network cabinet/paging speakers WITH an integrated colored signal light
    text: >
      C11 series (e.g. the C1110-E Network Cabinet Speaker) are network
      audio devices running AXIS OS — audio APIs (audio control, media
      clips, SIP) apply; camera/video APIs (image, stream profiles, PTZ,
      capture mode) do not. Unlike most speakers, the C1110-E ALSO has an
      integrated colored signal light: it supports the siren-and-light
      light function with Blink, Pulse and Steady patterns in red, green,
      blue, yellow, purple, turquoise and white (configurable intensity,
      speed, priority and duration). So "blink the light red for N
      seconds" IS achievable on this device. Use findmydevice.cgi only
      for locating the unit (status-LED flash/beep, no color); use the
      siren-and-light light function for colored signalling. Call
      getCapabilities for exact supported values.
    tags: [audio, vapix, light, signal, blink, color, red, siren, speaker]
