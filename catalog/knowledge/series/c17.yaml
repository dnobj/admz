series: c17
product_line: network-speakers
display_name: C17 Series Network Speakers
applies_to: "C17xx network speakers (C1710, C1731-E)"

hints:
  - id: c17-audio-focus
    topic: audio-playback
    summary: C17 series are dedicated audio playback devices
    text: >
      C17 series speakers are purpose-built for audio playback and
      announcements. They run AXIS OS and support VAPIX for configuration.
      Key APIs include audio control (audiocontrol.cgi), media clip
      management, and streaming audio upload.
    tags: [audio, vapix, api]

  - id: c17-no-video
    topic: vapix-support
    summary: C17 speakers have no video capabilities
    text: >
      C17 series speakers do not have cameras or video capabilities.
      Video-related VAPIX APIs (image, stream profiles, PTZ) are not
      available on these devices.
    tags: [limitation, video]
