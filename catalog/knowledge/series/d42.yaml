series: d42
product_line: strobe-sirens
display_name: D42 Series Network Strobe Sirens
applies_to: "D42xx network strobe sirens (e.g. D4100-E, D4200-VE)"

hints:
  - id: d42-use-siren-and-light
    topic: siren-and-light
    summary: D42 strobe sirens flash and sound via the siren_and_light API
    text: >
      D42xx devices are network strobe sirens, not cameras. To make the
      light flash (any color) or the siren sound — for signalling,
      notification, or deterrence — use siren_and_light.cgi:start, and
      siren_and_light.cgi:stop to end it. start has TWO forms:
      (1) INSTANTANEOUS / "do this now" — pass the light/siren pattern
      directly with no pre-configured profile. This is the form for a
      one-off request like "flash white for 30 seconds":
      light_pattern="Steady", light_colors=["white"], light_intensity=1,
      light_duration_unit="seconds", light_duration_value=30.
      (2) SAVED PROFILE — pass only `profile` (a reusable named combo
      created with addProfile and listed by getProfiles). Use this when
      the user wants a repeatable, named pattern.
      Call getCapabilities to learn the exact pattern names, colors, and
      intensity levels the device supports. Do NOT use findmydevice.cgi
      for this — that only blinks the status LED / beeps to physically
      locate the unit and cannot set a color or run a signalling pattern.
    tags: [flash, flashing, light, siren, strobe, color, white, red,
           blue, deter, signalling, alarm, notification, profile,
           instantaneous]

  - id: d42-not-a-camera
    topic: vapix-support
    summary: D42 strobe sirens have no camera or video pipeline
    text: >
      D42xx devices are strobe sirens. Video-related VAPIX APIs (image
      settings, stream profiles, PTZ, capture mode) do not apply. Their
      signature capabilities are the siren and the configurable strobe
      light (siren_and_light.cgi) plus audio.
    tags: [limitation, video, camera]
