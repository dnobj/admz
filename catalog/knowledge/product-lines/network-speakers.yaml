product_line: network-speakers
display_name: Network Speakers
applies_to: "All Axis network speakers and audio devices"

hints:
  - id: speakers-vapix-support
    topic: vapix-support
    summary: Axis speakers run AXIS OS and support VAPIX
    text: >
      Axis network speakers run AXIS OS and support VAPIX for device
      configuration. However, video-related APIs are not available.
      Key speaker-specific APIs include audio control, media clip
      management, and SIP configuration.
    tags: [api, vapix, audio]

  - id: speakers-audio-focus
    topic: audio-playback
    summary: Speakers are optimized for audio playback and announcements
    text: >
      Network speakers support audio streaming (G.711, G.726, AAC,
      Opus), pre-recorded clip management, scheduled announcements,
      and volume control. Audio is managed via the VAPIX Audio API.
    tags: [audio, playback, streaming]
