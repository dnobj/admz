product_line: network-speakers
display_name: Network Speakers
applies_to: "All Axis network speakers and audio devices"

hints:
  - id: speakers-vapix-support
    topic: vapix-support
    summary: Axis speakers run AXIS OS and support VAPIX
    text: >
      Axis network speakers run AXIS OS and support VAPIX for device
      configuration. However, video-related APIs are not available.
      Key speaker-specific APIs include audio control, media clip
      management, and SIP configuration.
    tags: [api, vapix, audio]

  - id: speakers-audio-focus
    topic: audio-playback
    summary: Speakers are optimized for audio playback and announcements
    text: >
      Network speakers support audio streaming (G.711, G.726, AAC,
      Opus), pre-recorded clip management, scheduled announcements,
      and volume control. Audio is managed via the VAPIX Audio API.
    tags: [audio, playback, streaming]

  - id: speakers-locate-vs-signal-light
    topic: find-device
    summary: Two distinct light actions — findmydevice (locate) vs an integrated signal light (some speakers)
    text: >
      Distinguish two different things on speakers:
      (1) LOCATE: findmydevice.cgi:find flashes the device's status LED
      (and optionally a locator beep) so you can physically find the unit
      — no color, just on/off; findmydevice.cgi:stop ends it early.
      (2) SIGNAL LIGHT: SOME Axis audio devices have an integrated
      colored signal/strobe light (for notification or deterrence). Do
      NOT assume a speaker lacks one — the C1110-E, for example, has a
      colored light supporting Blink/Pulse/Steady patterns in red, green,
      blue, yellow, purple, turquoise and white, driven by the
      siren-and-light API. ALWAYS call the siren-and-light getCapabilities
      for the specific device before deciding what colors/patterns it can
      do, rather than guessing from the product type.
    tags: [led, light, blink, flash, locate, findmydevice, color, red,
           strobe, siren, signal, indicator, capabilities]
