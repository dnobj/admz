name: CI

# ADMZ had no CI at all before this workflow. See .github/workflows/README.md
# for the design notes, the deploy-key setup procedure, and the list of things
# this deliberately does NOT do.

on:
  push:
    branches: [master]
  pull_request:
    # `ready_for_review` is NOT in the default type set
    # (`opened`, `synchronize`, `reopened`) and is the single most load-bearing
    # line in this file. The Windows leg is skipped on draft PRs (see `suite`),
    # so without this event a PR opened as a draft and then marked ready — with
    # no further push — would go to merge having NEVER run Windows, and the
    # checks would read green because nothing ran. `synchronize` is listed
    # explicitly and must stay: dropping it silently stops CI on every
    # subsequent push to a PR, which is the same class of failure.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Fails in ~5s with an actionable message when the owner has not yet created
  # the deploy key, instead of letting three jobs each fail two minutes in with
  # the same root cause.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Require AXIS_API_ATLAS_DEPLOY_KEY
        env:
          DEPLOY_KEY: ${{ secrets.AXIS_API_ATLAS_DEPLOY_KEY }}
        run: |
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error title=Missing secret AXIS_API_ATLAS_DEPLOY_KEY::CI cannot install the private axis-api-atlas dependency, and must not fall back to PyPI (issue #179). Setup procedure: .github/workflows/README.md"
            {
              echo "## Waiting on \`AXIS_API_ATLAS_DEPLOY_KEY\`"
              echo
              echo "This is expected until the repository owner creates the deploy key."
              echo "CI **fails closed** rather than resolving \`axis-api-atlas\` from a"
              echo "package index, which is the dependency-confusion hazard of issue #179."
              echo
              echo "Setup procedure: [\`.github/workflows/README.md\`](.github/workflows/README.md)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Deploy key secret is present."

  # ---------------------------------------------------------------------------
  # The fast gate. `--collect-only` imports all 161 test modules and the whole
  # admz package, so it catches every syntax error, bad import, missing
  # dependency and --strict-markers violation. Measured at 5-7s locally, so a
  # typo costs a couple of minutes rather than the full suite's ~15.
  # ---------------------------------------------------------------------------
  quick:
    name: quick (import + collect)
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-admz
        with:
          deploy-key: ${{ secrets.AXIS_API_ATLAS_DEPLOY_KEY }}

      - name: Refuse to run against live hardware
        shell: bash
        run: bash .github/scripts/refuse_live_targets.sh

      - name: Collect every test
        shell: bash
        env:
          # CORRECTED in #254. This used to say fleet_settings was alone in
          # not creating its parent — "unlike the other 16 import-time stores".
          # That was wrong: EIGHT stores lacked the mkdir (tasks_store,
          # capture_store, confirm_store, chat_sessions, fleet_settings, and
          # the three lazy demo stores), and the directory was created by
          # whichever of the other twelve happened to import first — an
          # import-order accident, not a guarantee.
          #
          # Since #254 every one of them calls paths.ensure_admz_home() /
          # ensure_parent_dir(), so ADMZ_HOME no longer has to pre-exist and
          # the mkdir below is belt-and-braces. Both are kept: the env var
          # still pins the suite away from a real data directory, which is
          # what #257 is about, and tests/conftest.py now redirects it anyway.
          ADMZ_HOME: ${{ runner.temp }}/admz-home
        run: |
          set -euo pipefail
          mkdir -p "$ADMZ_HOME"
          python -m pytest --collect-only -q --no-cov -p no:cacheprovider \
            --ignore=tests/e2e \
            --ignore=tests/test_chat_action_live.py

  # ---------------------------------------------------------------------------
  # The real suite. Windows is the deployment target and the only place the SSPI
  # branch runs; Linux is the only place the `skipif(sys.platform == "win32")`
  # branches ever run, and those had never executed anywhere before this
  # workflow. Both still matter — what changed is *when* Windows runs.
  #
  # WHY (measured, from a real green run): windows-latest is 797s wall AND
  # billed at 2x, so it is 1,594 of the ~1,770 billable seconds a full-matrix
  # run costs — 90% of the bill. The free-tier private-repo allowance is
  # 2,000 min/month, i.e. ~68 full runs. We burned ~60 in one day and GitHub
  # began refusing jobs outright (11s, no steps, no runner).
  #
  # Two rules, and between them Windows still runs on every change before it
  # can merge:
  #
  #   1. Skipped entirely on `push` (see the `if:` below) — post-merge the
  #      suite re-tests code the PR proved green minutes earlier.
  #   2. Linux-only on DRAFT pull requests. GitHub will not let a draft PR be
  #      merged, so "not a draft" is exactly the set of PRs that can land, and
  #      marking one ready re-runs CI via the `ready_for_review` trigger above.
  #
  # Draft-first iteration is therefore an OPTIONAL cost optimisation, not a
  # correctness requirement: a non-draft PR behaves exactly as it always has.
  # Iterating in draft costs ~3 billable minutes a push instead of ~29.5.
  #
  # NOTE: this repo has no branch protection (free-tier private — the API
  # returns 403), so no workflow can *enforce* that Windows passed before a
  # merge. This arrangement only guarantees the result is present and visible
  # at merge time; a human still has to look at it.
  #
  # Escape hatch: `workflow_dispatch` runs the full matrix on any branch,
  # including one whose PR is still a draft.
  # ---------------------------------------------------------------------------
  suite:
    name: suite (${{ matrix.os }})
    needs: [quick]
    # Rule 1. `preflight` + `quick` still run on master (~43 billable seconds)
    # as a post-merge canary, so a merge that breaks an import is attributed to
    # the merge instead of surfacing inside the next unrelated PR.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Rule 2. `github.event.pull_request` is null for `workflow_dispatch`,
        # and reading `.draft` off null yields null — falsy — so a manual run
        # gets the full matrix. A non-draft PR has `draft == false`, also
        # falsy, so it too gets the full matrix. ONLY a draft PR narrows this.
        # Kept on ONE line deliberately: a folded (`>-`) scalar does not fold
        # more-indented continuation lines, so wrapping this would embed literal
        # newlines in the expression.
        os: ${{ fromJSON(github.event.pull_request.draft && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-admz
        with:
          deploy-key: ${{ secrets.AXIS_API_ATLAS_DEPLOY_KEY }}

      - name: Refuse to run against live hardware
        shell: bash
        run: bash .github/scripts/refuse_live_targets.sh

      - name: Configure a git identity
        shell: bash
        # ~27 test files shell out to git and ~10 run `git init`/`git commit`
        # in a tmp dir. Nothing calls shutil.which("git") to skip, and a fresh
        # runner has no global user.name/user.email — so without this, tests
        # that pass on a developer box fail here for an unrelated reason.
        run: |
          git config --global user.email "ci@admz.invalid"
          git config --global user.name "ADMZ CI"
          git config --global init.defaultBranch main

      - name: Run the test suite
        shell: bash
        env:
          ADMZ_HOME: ${{ runner.temp }}/admz-home
        run: |
          set -euo pipefail
          mkdir -p "$ADMZ_HOME"
          # --no-cov overrides the --cov=admz/--cov-report=html in pytest.ini's
          # addopts, which are wanted locally but are pure cost here.
          #
          # Two paths are excluded at the PATH level so their modules are never
          # even imported:
          #   tests/e2e/                      -> defaults to http://127.0.0.1:4242,
          #                                      the PRODUCTION instance (issue #180).
          #   tests/test_chat_action_live.py  -> drives REAL CAMERAS over the
          #                                      network with verify=False and
          #                                      8/16/24s retries.
          # The second is only dormant because ADMZ_LIVE_CHAT_TESTS happens to be
          # unset; that is safety by accident, so it is excluded explicitly.
          # Setting ADMZ_LIVE_CHAT_TESTS or ADMZ_E2E_* in this workflow would
          # point CI at live hardware and a live fleet. Do not.
          python -m pytest -q --no-cov -p no:cacheprovider \
            --ignore=tests/e2e \
            --ignore=tests/test_chat_action_live.py \
            --durations=25
