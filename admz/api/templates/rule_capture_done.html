{% extends "base.html" %}

{% block title %}Credentials saved — {{ rule_name }}{% endblock %}

{% block content %}
<div style="max-width:480px;margin:24px auto;text-align:center;">
  <h1 class="page-title" style="margin-bottom:12px;">Credentials saved</h1>

  <div class="note-band" style="margin-bottom:22px;text-align:left;">
    <i data-lucide="check-circle"></i>
    <span>Recipient credentials for <strong>{{ rule_name }}</strong> on
      <span class="mono">{{ device_id }}</span> are held securely. Approve the rule
      to create it on the device.</span>
  </div>

  <a class="btn primary lg full" href="/confirm/{{ token }}">Review &amp; approve the rule</a>
</div>
{% endblock %}
