{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Add Device</h1>
</div>

<div class="form-container">
    <form id="add-device-form" action="/api/devices" method="POST">
        <div class="form-group">
            <label for="device_id">Device ID *</label>
            <input type="text" id="device_id" name="device_id" required>
            <small>Unique identifier for the device (e.g., front-door)</small>
        </div>

        <div class="form-group">
            <label for="nickname">Nickname</label>
            <input type="text" id="nickname" name="nickname">
            <small>Human-readable name (e.g., Front Door Camera)</small>
        </div>

        <div class="form-group">
            <label for="host">Host *</label>
            <input type="text" id="host" name="host" required>
            <small>IP address or hostname</small>
        </div>

        <div class="form-group">
            <label for="model">Model</label>
            <input type="text" id="model" name="model">
        </div>

        <div class="form-group">
            <label for="serial_number">Serial Number</label>
            <input type="text" id="serial_number" name="serial_number">
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location">
        </div>

        <div class="form-group">
            <label for="firmware_version">Firmware Version</label>
            <input type="text" id="firmware_version" name="firmware_version">
        </div>

        <div class="form-group">
            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" name="tags">
            <small>e.g., outdoor, entrance, parking</small>
        </div>

        <div class="form-actions">
            <button type="submit" class="button">Add Device</button>
            <a href="/" class="button button-secondary">Cancel</a>
        </div>
    </form>
</div>

<div id="message" class="message" style="display: none;"></div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('add-device-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const data = {
        device_id: formData.get('device_id'),
        host: formData.get('host'),
        nickname: formData.get('nickname') || undefined,
        model: formData.get('model') || undefined,
        serial_number: formData.get('serial_number') || undefined,
        location: formData.get('location') || undefined,
        firmware_version: formData.get('firmware_version') || undefined,
        tags: formData.get('tags') ? formData.get('tags').split(',').map(t => t.trim()) : []
    };

    try {
        const response = await fetch('/api/devices', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if (response.ok) {
            const created = await response.json();
            const ob = created.onboarding || {};
            if (ob.status === 'credentials_needed' && ob.capture_url) {
                // Automatic resolution failed — hand off to the secure
                // capture form (password never passes through this page).
                showMessage(
                    'Device added. Automatic credential setup did not succeed ('
                    + (ob.reason || 'unknown') + '). Opening the secure credential form…',
                    'info');
                setTimeout(() => { window.location.href = ob.capture_url; }, 1200);
            } else {
                window.location.href = `/device/${data.device_id}?onboarding=`
                    + encodeURIComponent(ob.status || '');
            }
        } else {
            const error = await response.json();
            showMessage('Error: ' + error.detail, 'error');
        }
    } catch (error) {
        showMessage('Error: ' + error.message, 'error');
    }
});

function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + type;
    msg.style.display = 'block';
}
</script>
{% endblock %}
